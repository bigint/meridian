accessories:
  cloudflared:
    # Cloudflare Tunnel connector. It dials out, so no ports open.
    # The tunnel's routes send traffic to http://kamal-proxy:80.
    image: cloudflare/cloudflared:2026.11.2
    roles: [ web ]
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        # cloudflared reads TUNNEL_TOKEN from %{secret}.
        - TUNNEL_TOKEN:%{secret}
