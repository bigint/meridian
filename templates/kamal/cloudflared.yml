accessories:
  cloudflared:
    # Connects out to Cloudflare, so the servers need no open ports. In the
    # tunnel's public hostname, send traffic to http://kamal-proxy:80.
    image: cloudflare/cloudflared:2026.11.2
    roles: [ web ]
    cmd: tunnel --no-autoupdate run
    env:
      secret:
        - TUNNEL_TOKEN
