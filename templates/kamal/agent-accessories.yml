  meridian_docker:
    image: tecnativa/docker-socket-proxy:v0.4.1
    roles: [ web ]
    network: meridian
    env:
      clear:
        CONTAINERS: 1
        POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  meridian_agent:
    image: ghcr.io/bigint/meridian-agent:%{agent_version}
    roles: [ web ]
    network: meridian
    env:
      clear:
        MERIDIAN_URL: %{meridian_url}
        DOCKER_HOST: tcp://SERVICE-meridian_docker:2375
        MERIDIAN_LABELS: region=REGION,provider=PROVIDER
        MERIDIAN_LOGS: 1
      secret:
        - MERIDIAN_TOKEN
    volumes:
      - /etc/machine-id:/host/etc/machine-id:ro
      - /etc/hostname:/host/etc/hostname:ro
      - /proc:/host/proc:ro
