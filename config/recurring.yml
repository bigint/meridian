shared: &shared
  reconcile_projects:
    class: ReconcileProjectsJob
    schedule: every 30 seconds
  expire_previews:
    class: PreviewExpiryJob
    schedule: every hour
  refresh_silent_agents:
    class: SilentAgentsJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *shared

production:
  <<: *shared
