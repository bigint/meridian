# The storefront. Destinations live in web.staging.yml and web.production.yml.
service: web
image: example/web

registry:
  server: ghcr.io
  username: example
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    RAILS_LOG_TO_STDOUT: "1"
  secret:
    - RAILS_MASTER_KEY

builder:
  arch: amd64
