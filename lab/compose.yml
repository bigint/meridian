name: meridian-lab

x-server: &server
  build: ./server
  privileged: true
  volumes:
    - ./.secrets/authorized_keys:/lab/authorized_keys:ro
  networks: [ lab ]
  restart: unless-stopped

services:
  registry:
    image: registry:2
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: lab
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - ./.secrets/htpasswd:/auth/htpasswd:ro
    ports: [ "127.0.0.1:5555:5000" ]
    networks: [ lab ]
    restart: unless-stopped

  # The same servers as FLEET in bin/lab.
  apse1-az1-node-01: { <<: *server, hostname: apse1-az1-node-01 }
  euc1-az1-node-01: { <<: *server, hostname: euc1-az1-node-01 }
  use1-az1-node-01: { <<: *server, hostname: use1-az1-node-01 }
  aps2-az1-node-01: { <<: *server, hostname: aps2-az1-node-01 }
  apse2-az1-node-01: { <<: *server, hostname: apse2-az1-node-01 }
  aps2-az1-node-02: { <<: *server, hostname: aps2-az1-node-02 }

  runner:
    build: ./runner
    environment:
      RUNNER_REPO: ${RUNNER_REPO:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    networks: [ lab ]
    restart: unless-stopped
    profiles: [ runner ]

networks:
  lab:
    name: meridian-lab
