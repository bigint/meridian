name: Bug
description: Something in Meridian or its agent doesn't work as documented.
labels: [ bug ]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meridian and agent versions
      placeholder: "v0.1.0, agent v0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove hostnames, IPs and tokens first.
      render: text
