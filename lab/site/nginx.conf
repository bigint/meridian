# nginx for one lab site container: the site's own server.conf, plus /up for kamal-proxy.
# Production's x-bigint-trace header is left out; the site's include of it matches nothing.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  access_log off;
  server_tokens off;
  absolute_redirect off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /sites/*/http.conf;

  server {
    listen 3000 default_server;

    location = /up {
      return 200 "ok\n";
    }

    location / {
      return 404;
    }
  }

  include /sites/*/server.conf;
}
