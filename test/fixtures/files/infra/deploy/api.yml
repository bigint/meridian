service: api
image: example/api

servers:
  web:
    - web-2.example.com
    - api-1.example.com

proxy:
  host: api.example.com
  app_port: 3000

env:
  secret:
    - DATABASE_URL
    - API_TOKEN:API_TOKEN_PRODUCTION

registry:
  server: ghcr.io
  username: example
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

accessories:
  db:
    image: postgres:17
    host: db-1.example.com
