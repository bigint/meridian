# %{service}: %{description}
# Generated by Meridian. This file is yours: edit it like any Kamal config.
service: %{service}
image: %{image}

# Meridian reads these labels to know the app's kind and source repository.
labels:
  meridian.kind: %{kind}
  meridian.source: %{source_repo}

%{servers}proxy:
%{proxy_host}  app_port: %{app_port}
  healthcheck:
    path: /up
%{env}
registry:
  server: %{registry}
  username: %{registry_username}
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
