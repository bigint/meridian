# nginx for the docs site: the static files `mint export` writes, served the
# way the export's own README asks, plus /up for kamal-proxy.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  access_log off;
  server_tokens off;
  absolute_redirect off;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080 default_server;
    root /usr/share/nginx/html;

    location = /up {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Content-hashed bundles, fonts and images: they never change.
    location ~ ^/(_mintlify/assets|_mintlify/export-assets|_next/static)/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # A page at /<path> is <path>/index.html. Pages are checked on every visit.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}
