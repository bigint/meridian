# Shaped like a real production edge config: what every Kamal web server runs
# besides the sites, as accessories only. Tunnel "kamal" routes each site's
# hostname to http://kamal-proxy:80, which routes by Host.
#   kamal accessory boot all -c kamal/edge.yml
service: edge
image: example/edge   # unused: no app, accessories only
# Kamal needs a primary role even for accessories; never run "kamal deploy" with this file.
servers:
  web:
    proxy: false
    hosts:
      - kamal-blr-01
      - kamal-blr-02
      - kamal-sgp-01
registry:
  server: localhost:5555   # required by Kamal; the accessory images come from Docker Hub
builder:
  arch: amd64

ssh:
  user: root

x-cloudflared: &cloudflared
  image: cloudflare/cloudflared:2026.11.0
  cmd: tunnel --no-autoupdate --protocol http2 --metrics 0.0.0.0:2000 run
  env:
    secret:
      - TUNNEL_TOKEN:KAMAL_TUNNEL_TOKEN

# Cloudflare shows each replica under its hostname.
x-cloudflared-options: &cloudflared-options
  read-only: true
  cap-drop: ALL
  memory: 256m
  stop-timeout: 35

accessories:
  cloudflared-blr-01:
    <<: *cloudflared
    host: kamal-blr-01
    options:
      <<: *cloudflared-options
      hostname: kamal-blr-01
  cloudflared-blr-02:
    <<: *cloudflared
    host: kamal-blr-02
    options:
      <<: *cloudflared-options
      hostname: kamal-blr-02
  cloudflared-sgp-01:
    <<: *cloudflared
    host: kamal-sgp-01
    options:
      <<: *cloudflared-options
      hostname: kamal-sgp-01
  # GET /health checks every site through this server's kamal-proxy: 200 if
  # all answer 200, else 503. Published on 127.0.0.1:8081 only.
  health:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    hosts:
      - kamal-blr-01
      - kamal-blr-02
      - kamal-sgp-01
    port: "127.0.0.1:8081:8080"
    env:
      clear:
        SITES: example.com www.example.org
    options:
      read-only: true
      memory: 64m
  # Streams this server's container logs to a log viewer elsewhere. Read-only.
  log-agent:
    image: amir20/dozzle:v11.5.0
    hosts:
      - kamal-blr-01
      - kamal-blr-02
      - kamal-sgp-01
    cmd: agent
    port: "127.0.0.1:7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    options:
      read-only: true
      memory: 64m
