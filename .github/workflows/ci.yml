name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsodium23

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The agent has no dependencies, so no go.sum: key the cache on go.mod.
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2

      - name: bin/ci
        run: bin/ci

      - name: The image builds
        run: docker build --tag meridian:ci .

      - name: The agent image builds
        run: docker build --tag meridian-agent:ci agent

      # Production loads less than development, so parse a config in the built image.
      - name: The image parses a Kamal config
        run: >-
          docker run --rm
          -v "$PWD/script/smoke_parse.rb:/rails/script/smoke_parse.rb:ro"
          -e SECRET_KEY_BASE=ci -e MERIDIAN_URL=http://localhost
          meridian:ci bin/rails runner script/smoke_parse.rb

  # The docs site in docs/: checks only. Docs deploy (docs-deploy.yml) publishes it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: bin/docs check
        run: bin/docs check
