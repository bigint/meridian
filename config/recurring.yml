shared: &shared
  reconcile_projects:
    class: ReconcileProjectsJob
    schedule: every 30 seconds
  refresh_silent_agents:
    class: SilentAgentsJob
    schedule: every minute
  # Destroyed, not deleted: the user's open cables hang up, and only those
  # of sessions still active come back.
  clear_expired_sessions:
    command: "Session.expired.find_each(&:destroy)"
    schedule: every hour at minute 42

development:
  <<: *shared

production:
  <<: *shared
