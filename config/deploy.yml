# Meridian deploys itself with Kamal. Copy this file, fill in the five
# numbered placeholders, put the secrets in .kamal/secrets, then
# `kamal setup`. See docs/install.mdx.
service: meridian
image: ghcr.io/bigint/meridian             # 5. your registry, if you build the image yourself

servers:
  web:
    - meridian.internal.example.com        # 1. the host to run on

proxy:
  host: meridian.example.com               # 2. where you'll reach it
  ssl: true

registry:
  server: ghcr.io
  username: your-github-user              # 3. a registry you can pull from
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    MERIDIAN_URL: https://meridian.example.com   # 4. same as proxy.host
    # Solid Queue runs inside Puma. For large installs, set this to "false"
    # and uncomment the job role below.
    SOLID_QUEUE_IN_PUMA: true
  secret:
    - SECRET_KEY_BASE
    - GITHUB_APP_ID
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_APP_WEBHOOK_SECRET

# job:
#   hosts:
#     - meridian.internal.example.com
#   cmd: bin/jobs

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f

# SQLite databases live here. Back them up with Litestream: docs/operate/backups.mdx.
volumes:
  - "meridian_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  args:
    VERSION: <%= `git describe --tags --always`.strip %>
