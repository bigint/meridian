# Builds and publishes the app, agent and docs images when a version tag is pushed.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: meridian
            context: .
            build-args: VERSION=${{ github.ref_name }}
          - name: meridian-agent
            context: agent
            build-args: VERSION=${{ github.ref_name }}
          # The docs site: built from the root for CHANGELOG.md. It takes no VERSION.
          - name: meridian-docs
            context: .
            file: docs/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
