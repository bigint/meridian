# Meridian agent: add under `accessories:` in a Kamal config that reaches
# every host, then `kamal accessory boot meridian_docker meridian_agent`.
# Put MERIDIAN_TOKEN in .kamal/secrets. Replace SERVICE with the config's
# service.
  meridian_docker:
    # Read-only Docker API: only GETs under /containers (list, inspect
    # and, while someone is looking, stats and logs).
    image: tecnativa/docker-socket-proxy:v0.4.1
    roles: [ web ]
    env:
      clear:
        CONTAINERS: 1
        POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  meridian_agent:
    image: ghcr.io/bigint/meridian-agent:v0.1.0
    roles: [ web ]
    env:
      clear:
        MERIDIAN_URL: %{meridian_url}
        DOCKER_HOST: tcp://SERVICE-meridian_docker:2375
        MERIDIAN_LABELS: region=REGION,provider=PROVIDER
        # Let deployers read Kamal containers' logs live in Meridian. Logs can
        # hold secrets; they are relayed, never stored. Remove to turn off.
        MERIDIAN_LOGS: 1
      secret:
        - MERIDIAN_TOKEN
    volumes:
      - /etc/machine-id:/host/etc/machine-id:ro
      - /etc/hostname:/host/etc/hostname:ro
      # Host CPU, memory and load for live stats. Leave it out and Meridian
      # shows per-container numbers only.
      - /proc:/host/proc:ro
